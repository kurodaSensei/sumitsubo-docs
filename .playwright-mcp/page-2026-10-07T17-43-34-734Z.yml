      - region [ref=f7e83]:
        - heading "Seis plugins que encajan entre sí" [level=2] [ref=f7e84]
        - generic [ref=f7e85]:
          - article [ref=f7e87]:
            - paragraph [ref=f7e88]: 01 · 6 comandos · 8 skills
            - heading "sumi" [level=3] [ref=f7e89]
            - paragraph [ref=f7e90]: "Núcleo de ingeniería: flujo de trabajo adaptable (trivial → delegado → expediente de funcionalidad), presupuestos de líneas, controles de riesgo, lentes de revisión sin contexto, estándares de HTML/CSS/JS/accesibilidad/rendimiento y hooks de seguridad."
          - article [ref=f7e92]:
            - paragraph [ref=f7e93]: 02 · 3 comandos · 6 skills
            - heading "sumi-design" [level=3] [ref=f7e94]
            - paragraph [ref=f7e95]: "Dirección de diseño contra el relleno genérico: brief, anti-referencias, tres direcciones divergentes, registro de repeticiones entre proyectos, tokens de DESIGN.md y reglas de movimiento. Orquesta las skills de Impeccable, Taste y Emil Kowalski."
          - article [ref=f7e97]:
            - paragraph [ref=f7e98]: 03 · 5 skills
            - heading "sumi-nuxt" [level=3] [ref=f7e99]
            - paragraph [ref=f7e100]: "Paquete de stack Nuxt 3/4 + Vue 3 + Firebase/Firestore: composables, seguridad en SSR e hidratación, modelado de datos, reglas de seguridad y Tailwind."
          - article [ref=f7e102]:
            - paragraph [ref=f7e103]: 04 · 5 skills
            - heading "sumi-react" [level=3] [ref=f7e104]
            - paragraph [ref=f7e105]: "Paquete de stack React 19 + App Router de Next.js: fronteras entre servidor y cliente, obtención y caché de datos, formularios y acciones, arquitectura de componentes."
          - article [ref=f7e107]:
            - paragraph [ref=f7e108]: 05 · 5 skills
            - heading "sumi-shopify" [level=3] [ref=f7e109]
            - paragraph [ref=f7e110]: "Paquete de stack Shopify Online Store 2.0: Liquid, secciones, bloques, esquemas, fragmentos, rendimiento del tema y flujo con la CLI."
          - article [ref=f7e112]:
            - paragraph [ref=f7e113]: 06 · 4 skills
            - heading "sumi-wordpress" [level=3] [ref=f7e114]
            - paragraph [ref=f7e115]: "Temas de bloques nativos de WordPress (FSE, Gutenberg) sin paso de compilación: theme.json como sistema de diseño, plantillas HTML y patrones en PHP, bloques dinámicos propios (block.json + render.php) con editores en JavaScript plano, APIs del núcleo antes que plugins, y auditorías de rendimiento y de tokens."
